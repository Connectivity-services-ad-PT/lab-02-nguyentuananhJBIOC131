openapi: 3.1.0
info:
  title: Smart Campus — IoT Ingestion API (Group A1)
  version: 1.0.0
  description: |
    Hợp đồng API (Contract) cho dịch vụ IoT Ingestion - Nhóm A1.
    Chịu trách nhiệm tiếp nhận dữ liệu đo đạc (telemetry) từ các cảm biến IoT và cung cấp dữ liệu này cho các dịch vụ khác (như Analytics - Nhóm A5).
  contact:
    name: Nhóm A1 - Nguyễn Tuấn Anh
    email: student@example.edu.vn
servers:
  - url: http://localhost:4010
    description: Prism mock server
  - url: https://api.campus.local
    description: Class network placeholder
tags:
  - name: health
    description: Kiểm tra trạng thái service
  - name: telemetry
    description: Quản lý tiếp nhận và cung cấp dữ liệu cảm biến
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Kiểm tra trạng thái service
      description: Endpoint kiểm tra service còn hoạt động.
      tags: [health]
      security: []
      responses:
        '200':
          description: Service đang hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                ok:
                  value:
                    status: ok
                    service: iot-ingestion-a1
                    time: '2026-05-27T08:00:00Z'

  /api/v1/telemetry:
    post:
      operationId: ingestTelemetry
      summary: Tiếp nhận dữ liệu từ thiết bị IoT
      description: |
        Endpoint cho phép các thiết bị hoặc IoT Gateway gửi dữ liệu đo đạc lên hệ thống.
      tags: [telemetry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryPayload'
            examples:
              validRequest:
                value:
                  device_id: SENSOR_A201_01
                  timestamp: '2026-05-27T09:30:00Z'
                  readings:
                    temperature: 26.5
                    humidity: 65.2
                    co2: 850
      responses:
        '201':
          description: Dữ liệu đã được ghi nhận thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionResponse'
              examples:
                success:
                  value:
                    status: success
                    message: Telemetry data ingested successfully
                    reading_id: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      operationId: getTelemetryHistory
      summary: Lấy lịch sử dữ liệu cảm biến
      description: Endpoint cung cấp dữ liệu thô cho các dịch vụ khác (ví dụ Analytics - A5) theo cơ chế phân trang.
      tags: [telemetry]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách dữ liệu cảm biến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryPage'
              examples:
                firstPage:
                  value:
                    items:
                      - reading_id: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                        device_id: SENSOR_A201_01
                        timestamp: '2026-05-27T09:30:00Z'
                        readings:
                          temperature: 26.5
                          humidity: 65.2
                        received_at: '2026-05-27T09:30:02Z'
                    nextCursor: null
                    hasMore: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor dùng để lấy trang tiếp theo.
      schema:
        type: [string, 'null']
        minLength: 1
        maxLength: 200
    Limit:
      name: limit
      in: query
      required: false
      description: Số bản ghi tối đa mỗi trang.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, service, time]
      properties:
        status:
          type: string
          enum: [ok]
          description: Trạng thái service.
          example: ok
        service:
          type: string
          example: iot-ingestion-a1
        time:
          type: string
          format: date-time
          example: '2026-05-27T08:00:00Z'

    TelemetryPayload:
      type: object
      additionalProperties: false
      required: [device_id, timestamp, readings]
      properties:
        device_id:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[A-Za-z0-9_-]+$'
          description: Mã định danh thiết bị.
          example: SENSOR_A201_01
        timestamp:
          type: string
          format: date-time
          description: Thời gian thiết bị ghi nhận dữ liệu (UTC).
          example: '2026-05-27T09:30:00Z'
        readings:
          type: object
          additionalProperties:
            type: number
          description: Tập hợp các chỉ số đo đạc dạng key-value.
          example:
            temperature: 26.5
            humidity: 65.2

    IngestionResponse:
      type: object
      additionalProperties: false
      required: [status, message, reading_id]
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Telemetry data ingested successfully
        reading_id:
          type: string
          format: uuid
          description: Mã giao dịch/bản ghi do Ingestion sinh ra.
          example: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc

    TelemetryRecord:
      type: object
      additionalProperties: false
      required: [reading_id, device_id, timestamp, readings, received_at]
      properties:
        reading_id:
          type: string
          format: uuid
        device_id:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[A-Za-z0-9_-]+$'
        timestamp:
          type: string
          format: date-time
        readings:
          type: object
          additionalProperties:
            type: number
        received_at:
          type: string
          format: date-time
          description: Thời gian server nhận được dữ liệu.

    TelemetryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryRecord'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, code, message]
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string

  responses:
    BadRequest:
      description: Dữ liệu sai định dạng
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://campus.local/errors/validation
            title: Dữ liệu không hợp lệ
            status: 400
            detail: Payload bị thiếu trường bắt buộc
            instance: /api/v1/telemetry
            errors:
              - field: device_id
                code: MISSING_FIELD
                message: device_id is required
    Unauthorized:
      description: Thiếu hoặc sai thông tin xác thực
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Dữ liệu đúng định dạng JSON nhưng vi phạm nghiệp vụ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Vượt quá giới hạn gọi API (Rate Limiting)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Lỗi hệ thống
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'